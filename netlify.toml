# Netlify builds every push via its GitHub integration: main → production, pull requests → previews.
# The dist check runs inside the build, so a broken page or missing asset fails the build and
# Netlify keeps the current site live (deploys are atomic).
[build]
  command = "npm run build && node scripts/verify-dist.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Pages use <base href="../"> with relative links (index.html#…). Netlify's "pretty URLs" rewrites
# those relative to the file and ignores <base>, which sent the Nosotras logo and nav to
# /nosotras/#… instead of the home page. The links are already correct, so leave HTML untouched.
[build.processing.html]
  pretty_urls = false

# The previous WordPress site's pages: send old links and search results to their new home
# instead of a 404. A path that exists on the new site always wins (no force).
[[redirects]]
  from = "/about/*"
  to = "/nosotras/"
  status = 301
[[redirects]]
  from = "/nosotros/*"
  to = "/nosotras/"
  status = 301
[[redirects]]
  from = "/sobre-nosotros/*"
  to = "/nosotras/"
  status = 301
[[redirects]]
  from = "/equipo/*"
  to = "/nosotras/"
  status = 301
[[redirects]]
  from = "/contact/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/contacto/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/servicios/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/blog/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/privacy-policy/*"
  to = "/aviso-de-privacidad/"
  status = 301
[[redirects]]
  from = "/politica-de-privacidad/*"
  to = "/aviso-de-privacidad/"
  status = 301

# Astro's bundles are content-hashed, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Site art keeps stable names and gets replaced in place (e.g. staff photos), so browsers must
# revalidate on every visit; unchanged files come back as a cheap 304 via the ETag.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://app.cal.com\")"
